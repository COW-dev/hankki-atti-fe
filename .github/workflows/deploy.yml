name: Deploy FE

on:
  workflow_call:
    inputs:
      image_tag:
        description: '업로드된 FE 이미지 버전 (vX.Y.Z)'
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포·롤백할 기존 FE 이미지 버전 (예: v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 자동 배포·수동 롤백이 같은 FE 매니페스트를 동시에 수정하지 않게 한다.
    concurrency:
      group: deploy-fe-manifest
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/cow-dev/hankki-atti-fe
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
    steps:
      - name: 입력 확인
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_REPOSITORY" || { echo '::error::DEPLOY_REPOSITORY 변수가 필요합니다'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo '::error::DEPLOY_SSH_KEY Secret이 필요합니다'; exit 1; }
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::image_tag는 vX.Y.Z 형식이어야 합니다'; exit 1; }

      # 이미지는 기존 정책대로 공개 GHCR에서 확인한다. 빌드·push·latest 변경은 하지 않는다.
      - name: 기존 이미지 확인
        run: docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null

      - name: 배포 저장소 SSH checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEPLOY_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: FE 이미지 버전 갱신
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('k8s/fe/atti-fe.yaml')
          source = path.read_text(encoding='utf-8')
          image = os.environ['IMAGE_NAME']
          target = image + ':' + os.environ['IMAGE_TAG']
          pattern = r'(?m)^(\s*image:\s*)' + re.escape(image) + r'(?::[^\s#]+|@[^\s#]+)([ \t]*(?:#.*)?)$'
          updated, count = re.subn(pattern, lambda match: match[1] + target + match[2], source)
          if count != 1:
              raise SystemExit('대상 이미지가 정확히 한 개 있어야 합니다')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: 배포 저장소에 커밋 및 push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- k8s/fe/atti-fe.yaml
          if git diff --cached --quiet; then
            echo '이미 같은 이미지 버전입니다'
            exit 0
          fi
          git commit -m "ci: 프론트엔드 배포 이미지 $IMAGE_TAG 반영"
          git push origin HEAD:main
