name: CI

# push는 main에만 건다. 작업 브랜치까지 걸면 PR마다 push CI와 PR CI가 중복 실행된다.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

# PR은 새 push가 오면 이전 실행을 취소하고, main은 배포가 중간에 끊기지 않도록 순서대로 실행한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks (시크릿 스캔)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1

  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 에이전트 설정 구조 검증 (심링크/CLAUDE.md)
        run: |
          set -e
          test -d .agents/commands || { echo "::error::.agents/commands 없음"; exit 1; }
          test -L .claude/commands && test -e .claude/commands || { echo "::error::.claude/commands 심링크 깨짐"; exit 1; }
          test -L .codex/commands && test -e .codex/commands || { echo "::error::.codex/commands 심링크 깨짐"; exit 1; }
          grep -q "@AGENTS.md" CLAUDE.md || { echo "::error::CLAUDE.md에 @AGENTS.md import 없음"; exit 1; }
          test -f docs/design-system.md || { echo "::error::docs/design-system.md 없음"; exit 1; }
          echo "OK"

  # main 병합 후 모든 검사가 통과하면 배포 여부·버전을 정하고 git 태그로 버전을 선점한다
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, secret-scan, agent-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 배포 여부·버전 결정
        id: version
        run: bash .github/scripts/release-version.sh

      # 이미지보다 태그를 먼저 push한다 — 동시에 같은 버전을 노리면 여기서 실패해 이미지가 덮어써지지 않는다
      - name: 버전 태그 push
        if: steps.version.outputs.new_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

  docker:
    if: needs.version.outputs.release == 'true'
    needs: version
    runs-on: ubuntu-latest
    # GHCR push는 별도 Secret 없이 GITHUB_TOKEN으로 한다
    permissions:
      contents: read
      packages: write
    env:
      # GHCR 경로는 소문자만 허용한다 (조직 COW-dev → cow-dev)
      IMAGE_NAME: ghcr.io/cow-dev/hankki-atti-fe
      VERSION: ${{ needs.version.outputs.version }}
      # 다른 도메인으로 가는 링크(siteUrl)의 기준이고 번들에 박힌다. http/https를 바꿀 때는 이 줄만 고친다
      # 이 줄이 바뀌면 release-version.sh가 새 버전을 낸다
      NEXT_PUBLIC_SITE_URL: https://atti.bluerack.org

    steps:
      - uses: actions/checkout@v7

      # 최종 스테이지에 RUN이 없어 arm64 빌드에도 QEMU가 필요 없다
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR에는 Docker Hub 같은 불변 태그 설정이 없어, 이미 올라간 버전 태그를 덮어쓰지 않도록 직접 막는다
      - name: 버전 태그 중복 확인
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE_NAME:$VERSION 이미 있음 — 버전 태그는 덮어쓰지 않는다"
            exit 1
          fi

      - name: 스모크 테스트용 이미지 빌드 (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          build-args: NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 스모크 테스트 (Host별 라우팅·아이콘·비루트·번들 확인)
        run: bash .github/scripts/smoke-test.sh "$IMAGE_NAME:smoke"

      - name: 이미지 push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, docker]
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.version.outputs.version }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
